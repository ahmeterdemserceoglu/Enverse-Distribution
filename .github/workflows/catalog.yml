name: Sign application catalog

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*.apk' --clobber
      - name: Generate and sign catalog
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: node scripts/generate-catalog.mjs
      - name: Commit catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps.json
          git diff --cached --quiet || git commit -m "chore: refresh signed catalog"
          git push origin HEAD:main
